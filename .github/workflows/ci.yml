name: CI — Syntax & Lint

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-syntax:
    name: Python Lint & Syntax Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install core dependencies (no heavy ML libs for CI speed)
        run: |
          python -m pip install --upgrade pip
          pip install pylint pyflakes numpy scipy matplotlib

      - name: Run pyflakes syntax check on src/
        run: |
          python -m pyflakes src/ || true

      - name: Run pyflakes syntax check on scripts/
        run: |
          python -m pyflakes scripts/ || true

      - name: Run pylint on src/ (with research-appropriate config)
        run: |
          pylint src/ \
            --disable=C0114,C0115,C0116,R0903,R0913,W0611,E0401 \
            --max-line-length=120 \
            --fail-under=6.0
        continue-on-error: true

      - name: Verify Python syntax on all scripts
        run: |
          find scripts/ -name "*.py" -exec python -m py_compile {} \;
          echo "All scripts passed syntax check!"

      - name: Verify Python syntax on src/
        run: |
          find src/ -name "*.py" -exec python -m py_compile {} \;
          echo "All src modules passed syntax check!"

      - name: Check import structure of core modules
        run: |
          python -c "import ast, os
          for root, dirs, files in os.walk('src'):
              dirs[:] = [d for d in dirs if d != '__pycache__']
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as fp:
                          try:
                              ast.parse(fp.read())
                              print(f'  ✓ {path}')
                          except SyntaxError as e:
                              print(f'  ✗ {path}: {e}')
                              exit(1)
          print('All AST checks passed!')"
